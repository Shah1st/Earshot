[project]
name = "earshot-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ai-edge-litert>=2.4.0",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "piper-tts>=1.8.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "vosk>=0.3.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earshot"]
